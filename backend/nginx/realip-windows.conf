# Windows deployment only (mounted by docker-compose.windows.yml into /etc/nginx/realip.d/).
#
# Docker Desktop hides the lab PCs' addresses: everything reaches this container from the Docker gateway. In this mode
# the Nginx running on Windows itself (deploy/windows/nginx.conf) receives the lab PCs' connections, sees their real
# addresses and passes them in X-Real-IP. This container's port is bound to 127.0.0.1 only, so the gateway address
# can only be the Windows machine itself: the header is believed from the gateway and from nowhere else.
set_real_ip_from 172.28.0.1;
real_ip_header   X-Real-IP;

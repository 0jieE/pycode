worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Notebook-sized requests only: code is saved file by file (100 KB max each).
    client_max_body_size   256k;
    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           30s;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types      application/json text/plain text/css text/javascript application/javascript image/svg+xml;

    # --- the real client address -------------------------------------------------------------------------
    # Normally the client connects to this Nginx directly and $remote_addr is its address. In the Windows deployment
    # (docker-compose.windows.yml) a Nginx running on Windows itself sits in front, because Docker Desktop hides the
    # lab PCs' addresses; that mode adds a file here which believes X-Real-IP from the Docker gateway ONLY.
    include /etc/nginx/realip.d/*.conf;

    # --- rate limits (per client IP; every lab PC has its own address) --------------------------------
    limit_req_zone  $binary_remote_addr zone=run_zone:10m   rate=2r/s;    # Run button
    limit_req_zone  $binary_remote_addr zone=login_zone:10m rate=10r/s;   # slows password guessing
    limit_req_zone  $binary_remote_addr zone=register_zone:10m rate=5r/m; # sign-up with a registration code
    limit_req_zone  $binary_remote_addr zone=password_zone:10m rate=10r/m; # changing a password (also limited per user in the api)
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status  429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Logs: one line per request would be thousands per lab (autosave); keep errors and rejected requests.
    map $status $loggable { ~^[45] 1; default 0; }
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"ms":"$request_time"}';
    access_log /dev/stdout json if=$loggable;
    error_log  /dev/stderr warn;

    upstream api_upstream {
        server api:8000;
        keepalive 64;
        keepalive_timeout 60s;   # shorter than gunicorn's keepalive (75 s): Nginx is always the one to close
    }

    server {
        listen 80 default_server;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Errors Nginx produces itself use the API's {"detail", "code"} format.
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @api_unavailable;
        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"Too many requests, slow down","code":"RATE_LIMITED"}';
        }
        location @api_unavailable {
            default_type application/json;
            return 503 '{"detail":"Server unavailable, try again","code":"SERVER_UNAVAILABLE"}';
        }

        # WebSockets: long-lived, so no buffering and a long read timeout.
        location /api/v1/ws/ {
            limit_conn conn_zone 40;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never pass on what the client sent
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Run (lab or practice): 2 requests/second per IP, bursts of 5 (the API adds its own per-student 3 s rule).
        location ~ ^/api/v1/(workspace/[^/]+|practice)/run$ {
            limit_req zone=run_zone burst=5 nodelay;
            include /etc/nginx/api_proxy.conf;
        }

        # Sign-up: 5 requests/minute per IP, burst 3 (slows guessing of registration codes).
        location = /api/v1/auth/register {
            limit_req zone=register_zone burst=3 nodelay;
            include /etc/nginx/api_proxy.conf;
        }

        # Change password: 10 requests/minute per IP, burst 5. The api also allows only 5 attempts per user per 15 min.
        location = /api/v1/auth/change-password {
            limit_req zone=password_zone burst=5 nodelay;
            include /etc/nginx/api_proxy.conf;
        }

        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=30 nodelay;
            include /etc/nginx/api_proxy.conf;
        }

        location /api/ {
            include /etc/nginx/api_proxy.conf;
        }

        # The React frontend: the files of `npm run build` (frontend/dist, mounted read-only).
        root /usr/share/nginx/html;

        # Build files have a hash in their name (assets/index-3f9c2a.js) and never change: keep them
        # for a year. A file that does not exist is a real 404, never the HTML page.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # The page itself is re-checked on every visit, so a new build is picked up at once.
        location = /index.html {
            expires epoch;
        }

        # Every other path is a screen of the single-page app: hand it to index.html and let the
        # app's router show the right page (so a reload on /classes/3 works).
        location / {
            expires epoch;
            try_files $uri /index.html;
        }
    }
}

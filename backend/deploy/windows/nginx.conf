# Nginx for Windows, in front of the Docker stack (see docker-compose.windows.yml and the README).
#
# It runs on the Windows server itself, so it sees each lab PC's REAL address (Docker Desktop hides it), and passes
# it on in X-Real-IP / X-Forwarded-For, OVERWRITING whatever the client sent: a lab PC cannot pretend to be another.
# Everything else (rate limits, the frontend, WebSockets, timeouts) is handled by the Docker Nginx behind it.

worker_processes 1;            # Nginx for Windows effectively uses one worker

events {
    worker_connections 1024;   # the Windows build's limit; plenty for a lab (each student: a few connections)
}

http {
    server_tokens off;
    client_max_body_size 256k; # the same as the Docker Nginx
    access_log off;
    error_log logs/error.log warn;

    # WebSockets need "Connection: upgrade"; every other request keeps the connection to Docker open (keepalive).
    map $http_upgrade $connection_header {
        default upgrade;
        ''      '';
    }

    upstream lab_docker {
        server 127.0.0.1:8080;   # DOCKER_NGINX_PORT in docker-compose.windows.yml
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://lab_docker;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;         # the lab PC, as this server sees it
            proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, never appended
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_header;
            proxy_buffering off;          # live output and WebSockets go straight through
            proxy_read_timeout 3600s;     # interactive runs and monitor sockets stay open for long
            proxy_send_timeout 3600s;
            proxy_connect_timeout 5s;
        }

        # The Docker stack is not up (yet): a short JSON answer instead of Nginx's error page.
        error_page 502 503 504 = @docker_down;
        location @docker_down {
            default_type application/json;
            return 503 '{"detail":"Server unavailable, try again","code":"SERVER_UNAVAILABLE"}';
        }
    }
}
